apiVersion: v1
kind: Service
metadata:
  name: {{ include "itd.fullname" . }}-web
  labels:
    {{- include "itd.labels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "itd.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
