apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "itd.fullname" . }}-web
  labels:
    {{- include "itd.labels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "itd.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "itd.labels" (dict "root" . "component" "web") | nindent 8 }}
      annotations:
        # Pods restart when the config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.web.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "itd.appPodCommon" . | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.web.terminationGracePeriodSeconds }}
      # Migrations + target sync before the web server starts. Not a Helm hook: hooks run before
      # the Postgres StatefulSet exists on the first install. Retries the DB for waitForDbSeconds;
      # parallel replicas are safe (advisory lock).
      initContainers:
        - name: migrate
          {{- include "itd.appContainerCommon" (dict "root" . "web" false) | nindent 10 }}
          args: ["migrate-and-sync", "--wait-for-db", {{ .Values.migrate.waitForDbSeconds | quote }}]
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
      containers:
        - name: web
          {{- include "itd.appContainerCommon" (dict "root" . "web" true) | nindent 10 }}
          args: ["web", "--host", "0.0.0.0", "--port", {{ .Values.web.port | quote }}]
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          # /api/health needs the DB: right for readiness (no traffic while the DB is down), wrong
          # for liveness (a DB outage would restart every pod in a loop), so liveness only checks
          # that the server accepts connections.
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
