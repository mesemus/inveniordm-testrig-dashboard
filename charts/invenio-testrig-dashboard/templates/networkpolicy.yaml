{{- if .Values.networkPolicy.enabled }}
# web: only the ingress controller and this release's own pods may connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "itd.fullname" . }}-web
  labels:
    {{- include "itd.labels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "itd.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressControllerNamespaceSelector | nindent 14 }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: http
{{- if .Values.postgres.enabled }}
---
# postgres: only the app pods (web, migrate, CronJobs) of this release.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "itd.fullname" . }}-postgres
  labels:
    {{- include "itd.labels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "itd.selectorLabels" (dict "root" . "component" "postgres") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              invenio-testrig-dashboard/app: "true"
      ports:
        - port: postgres
{{- end }}
{{- end }}
