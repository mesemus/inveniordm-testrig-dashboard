{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "itd.fullname" . }}-postgres
  labels:
    {{- include "itd.labels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  selector:
    {{- include "itd.selectorLabels" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
