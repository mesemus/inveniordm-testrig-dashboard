{{- if .Values.postgres.enabled }}
{{- $pg := .Values.postgres }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "itd.fullname" . }}-postgres
  labels:
    {{- include "itd.labels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "itd.fullname" . }}-postgres
  selector:
    matchLabels:
      {{- include "itd.selectorLabels" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "itd.labels" (dict "root" . "component" "postgres") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Postgres needs time for a clean shutdown checkpoint.
      terminationGracePeriodSeconds: 60
      securityContext:
        # Started directly as the postgres user (the entrypoint skips its root/gosu step), with
        # the PVC group-owned by fsGroup, so the entrypoint can create PGDATA under it.
        runAsNonRoot: true
        runAsUser: {{ $pg.uid }}
        runAsGroup: {{ $pg.gid }}
        fsGroup: {{ $pg.gid }}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ $pg.image }}
          env:
            - name: POSTGRES_USER
              value: {{ $pg.user | quote }}
            - name: POSTGRES_DB
              value: {{ $pg.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", {{ $pg.user | quote }}, "-d", {{ $pg.database | quote }}]
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", {{ $pg.user | quote }}, "-d", {{ $pg.database | quote }}]
            # Generous: a crash-recovery start must not be killed half-way.
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          volumeMounts:
            # The 18+ image layout: mount the parent, PGDATA is /var/lib/postgresql/18/docker.
            - name: data
              mountPath: /var/lib/postgresql
            # Writable paths on a read-only root filesystem: the socket/lock dir, temp, shared memory.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ $pg.shmSizeLimit }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "itd.selectorLabels" (dict "root" . "component" "postgres") | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $pg.storage.className }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.storage.size }}
{{- end }}
