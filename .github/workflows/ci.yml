name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: invenio_testrig_dashboard
          POSTGRES_PASSWORD: invenio_testrig_dashboard
          POSTGRES_DB: invenio_testrig_dashboard
        ports:
          - 25432:5432
        options: >-
          --health-cmd "pg_isready -U invenio_testrig_dashboard"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      s3:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: devaccess
          RUSTFS_SECRET_KEY: devsecret
          RUSTFS_ADDRESS: "0.0.0.0:9000"
          RUSTFS_CONSOLE_ENABLE: "true"
          RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
          RUSTFS_VOLUMES: /data
        ports:
          - 29000:9000
          - 29001:9001
        options: >-
          --health-cmd "curl -f http://localhost:9000/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no floating major tag exists for v10: pin the release
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src
      - name: Create test buckets
        run: |
          aws --endpoint-url http://localhost:29000 s3 mb s3://invenio-testrig-dashboard-test || true
          aws --endpoint-url http://localhost:29000 s3 mb s3://invenio-testrig-dashboard-db-backup-test || true
        env:
          AWS_ACCESS_KEY_ID: devaccess
          AWS_SECRET_ACCESS_KEY: devsecret
          AWS_DEFAULT_REGION: us-east-1
      - name: PostgreSQL 18 client (pg_dump/pg_restore for tests/test_backup.py)
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - run: uv run pytest
      - name: OpenAPI schema is up to date
        run: |
          uv run invenio-testrig-dashboard export-openapi
          git diff --exit-code openapi.json
        env:
          ITD_SEED_REPOSITORY: oarepo/invenio-rdm-seed
          ITD_RUNNER_REPOSITORY: oarepo/invenio-testrig-dashboard-runner
          ITD_TESTRIG_REF: v1.0.0
          ITD_S3_BUCKET: invenio-testrig-dashboard-test
          ITD_DATABASE_URL: postgresql://invenio_testrig_dashboard:invenio_testrig_dashboard@localhost:25432/invenio_testrig_dashboard
          ITD_GITHUB_TOKEN: dummy
          ITD_S3_ACCESS_KEY: devaccess
          ITD_S3_SECRET_KEY: devsecret

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: invenio_testrig_dashboard
          POSTGRES_PASSWORD: invenio_testrig_dashboard
          POSTGRES_DB: invenio_testrig_dashboard
        ports:
          - 25432:5432
        options: >-
          --health-cmd "pg_isready -U invenio_testrig_dashboard"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      s3:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: devaccess
          RUSTFS_SECRET_KEY: devsecret
          RUSTFS_ADDRESS: "0.0.0.0:9000"
          RUSTFS_CONSOLE_ENABLE: "true"
          RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
          RUSTFS_VOLUMES: /data
        ports:
          - 29000:9000
          - 29001:9001
        options: >-
          --health-cmd "curl -f http://localhost:9000/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ITD_SEED_REPOSITORY: oarepo/invenio-rdm-seed
      ITD_RUNNER_REPOSITORY: oarepo/invenio-testrig-dashboard-runner
      ITD_TESTRIG_REF: v1.0.0
      ITD_S3_BUCKET: invenio-testrig-dashboard-test
      ITD_DATABASE_URL: postgresql://invenio_testrig_dashboard:invenio_testrig_dashboard@localhost:25432/invenio_testrig_dashboard
      ITD_GITHUB_TOKEN: dummy
      ITD_S3_ACCESS_KEY: devaccess
      ITD_S3_SECRET_KEY: devsecret
      ITD_S3_ENDPOINT_URL: http://localhost:29000
      ITD_PUBLIC_URL: http://127.0.0.1:8000
      # The smoke test cannot log in to GitHub; the login gate has its own API tests.
      ITD_REQUIRE_LOGIN: "false"
      ITD_TARGETS: '[{"branch": "master", "schedule": "0 1 * * *"}]'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no floating major tag exists for v10: pin the release
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
      - run: npm ci
        working-directory: frontend
      - name: Create test buckets
        run: |
          aws --endpoint-url http://localhost:29000 s3 mb s3://invenio-testrig-dashboard-test || true
          aws --endpoint-url http://localhost:29000 s3 mb s3://invenio-testrig-dashboard-db-backup-test || true
        env:
          AWS_ACCESS_KEY_ID: devaccess
          AWS_SECRET_ACCESS_KEY: devsecret
          AWS_DEFAULT_REGION: us-east-1
      - run: uv run invenio-testrig-dashboard migrate-and-sync
      # The shipped ok/failing fixtures share no test names, so the seed for the compare page
      # is a small purpose-built pair (base passes, head fails the same test).
      - run: uv run invenio-testrig-dashboard ingest-dir tests/fixtures/runs/e2e-base --target master
      - run: uv run invenio-testrig-dashboard ingest-dir tests/fixtures/runs/e2e-head --target master
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Playwright smoke test
        run: npx playwright test
        working-directory: frontend
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore

  # The Helm chart: lint, schema validation, and the rendering tests (tests/test_chart.py:
  # restricted Pod Security, secret keys, refusals). Not covered here yet: installing it on kind.
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - uses: astral-sh/setup-uv@v10.3.3  # no floating major tag exists for v10: pin the release
      - run: uv sync --locked
      - run: helm lint charts/invenio-testrig-dashboard
      - name: kubeconform (the deployment, and with every optional resource on)
        run: |
          helm template itd charts/invenio-testrig-dashboard \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary -kubernetes-version 1.33.0
          helm template itd charts/invenio-testrig-dashboard --set backup.enabled=true \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary -kubernetes-version 1.33.0
      - run: uv run pytest tests/test_chart.py
